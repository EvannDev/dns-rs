[package]
name = "dns-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
hickory-proto = "0.26.3"
humantime-serde = "1.1.1"
prometheus-client = "0.25.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util", "macros", "rt"] }
