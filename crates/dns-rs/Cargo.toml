[package]
name = "dns-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
hickory-proto = "0.26.3"
humantime-serde = "1.1.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
