# dns-rs configuration. Point DNS_RS_CONFIG at this file.
# Every section and key is optional; the values below are the defaults
# unless stated otherwise.
#
# The file is read again every 10 s and on SIGHUP. [blocking] changes apply
# at once; server.listen, http.listen, upstream.* and cache.size need a restart (logged
# once, not applied). An invalid file is rejected and the previous
# configuration keeps working.

[server]
# UDP and TCP listen address. Override: DNS_RS_LISTEN
listen = "0.0.0.0:53"

[http]
# Probes (/healthz, /readyz) and Prometheus metrics (/metrics) are read-only
# and without authentication: on a shared network, bind to 127.0.0.1:8080 or
# restrict access (Kubernetes NetworkPolicy). The API (/api/v1/...) needs a
# token, see below. Override: DNS_RS_HTTP_LISTEN
listen = "0.0.0.0:8080"
# The API (/api/v1/...) requires "Authorization: Bearer <token>" and is
# disabled without a token. The token comes from DNS_RS_API_TOKEN or from
# this file (a mounted Secret), at least 16 characters; never put it in this
# TOML. The file is read again on each reload, so rotating the token needs no
# restart. Probes and metrics need no token. Override: DNS_RS_API_TOKEN_FILE
# Example (default: none):
# api_token_file = "/run/secrets/dns-rs/api-token"

[upstream]
# Resolver queries are forwarded to; the port defaults to 53.
# Override: DNS_RS_UPSTREAM
server = "1.1.1.1:53"
# Override (milliseconds): DNS_RS_UPSTREAM_TIMEOUT_MS
timeout = "2s"

[cache]
# Maximum number of cached responses. Override: DNS_RS_CACHE_SIZE
size = 10000

[blocking]
# null: 0.0.0.0 / :: for A / AAAA, empty answer otherwise (default)
# nxdomain | nodata | refused
mode = "null"

# How often blocklists are downloaded again (at least 1m). A list that fails
# to refresh keeps blocking with its last valid version.
refresh = "24h"

# Blocklists: hosts files, plain domain lists or Adblock `||domain^` rules,
# from https:// URLs or file:///absolute/paths, loaded at startup and again
# every `refresh` (4 at a time). A list that fails (error, timeout after
# 30 s, over 64 MiB) is skipped and logged; DNS keeps working. Prefer
# https:// over http://: redirects from HTTPS down to HTTP are refused.
#
# A domain listed bare (`example.com`, or a hosts entry) blocks that name
# only, as in Pi-hole. Lists meant to cover subdomains too (OISD
# `domainswild2`, HaGeZi "wildcard domains") need the table form with
# `wildcard = true`. `*.example.com` and `||example.com^` lines always cover
# subdomains.
#
# Example (default: none):
# lists = [
#   "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts",
#   { url = "https://big.oisd.nl/domainswild2", wildcard = true },
#   "file:///etc/dns-rs/lists/mine.txt",
# ]
lists = []

# `example.com` blocks that name only, `*.example.com` it and its subdomains.
# Example (default: none): deny = ["ads.example.com", "*.tracker.example"]
deny = []
# Same syntax; allow always wins over deny and blocklists.
allow = []

# Regexes, matched against the lowercase name without trailing dot. Each list
# is compiled as one set: patterns that are too large together are rejected.
# Example (default: none): deny_regex = ['^ad[0-9]+\.']
deny_regex = []
allow_regex = []
