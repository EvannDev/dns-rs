name: Release

# A v* tag on main publishes a release: the multi-platform image (through
# image.yml), the Helm chart as an OCI artifact, then the GitHub release
# with the CHANGELOG section and the packaged chart. The release comes last,
# so it only exists once everything it points to does.
#
# Actions are pinned by commit SHA: this workflow can write packages and
# releases, so a moved tag must not change what runs (Dependabot updates the
# pins).
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CHART_REGISTRY: oci://ghcr.io/evanndev/charts

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Only reviewed code is released: the tagged commit is on main.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "$TAG is not on main" >&2; exit 1; }
          .github/scripts/check-release.sh "$TAG" | sed 's/^version /version=/' >>"$GITHUB_OUTPUT"

  image:
    needs: verify
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  chart:
    # After the image: a published chart must not point to a missing image.
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Package and push
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/dns-rs --destination "$RUNNER_TEMP/chart"
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/dns-rs-$VERSION.tgz" "$CHART_REGISTRY"
          # What users will pull renders.
          helm template check "$CHART_REGISTRY/dns-rs" --version "$VERSION" >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: ${{ runner.temp }}/chart/dns-rs-${{ needs.verify.outputs.version }}.tgz
          retention-days: 1

  release:
    needs: [verify, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: ${{ runner.temp }}/chart
      - name: Create the GitHub release
        run: |
          .github/scripts/release-notes.sh "$VERSION" >"$RUNNER_TEMP/notes.md"
          cat >>"$RUNNER_TEMP/notes.md" <<NOTES

          ## Install

          \`\`\`sh
          helm install dns-rs $CHART_REGISTRY/dns-rs --version $VERSION
          docker pull ghcr.io/evanndev/dns-rs:$VERSION
          \`\`\`
          NOTES
          prerelease=()
          [[ $VERSION == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --verify-tag --title "dns-rs $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}" \
            "$RUNNER_TEMP/chart/dns-rs-$VERSION.tgz"
