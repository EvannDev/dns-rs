name: Claude docs

# The docs agent (.claude/agents/docs.md) keeps the documentation true to
# the code: weekly (or on demand) it audits everything and opens a PR. On
# pull requests it runs in claude-pr.yml, before the review.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      task:
        description: What to document (leave empty for a full audit)
        required: false

concurrency:
  group: claude-docs-${{ github.ref }}
  # Never kill the agent between its commit and its push.
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Do not keep GITHUB_TOKEN in git config: checkout stores it as an
          # Authorization header that overrides the Claude app token, so the
          # agent's pushes would come from github-actions[bot], which GitHub
          # does not let trigger workflows (no CI on the agent's commits).
          persist-credentials: false

      # The agent runs cargo test / cargo doc; the version comes from
      # rust-toolchain.toml, as in CI.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The agent's report goes to the job summary, so a run that changes
          # nothing still says why. Only people with write access can start
          # this workflow.
          display_report: true
          prompt: |
            REPO: ${{ github.repository }}
            EVENT: ${{ github.event_name }}
            TASK: ${{ inputs.task }}

            Read .claude/agents/docs.md: it defines your role, what you own,
            your accuracy rules and your procedures. Follow it exactly.

            - EVENT schedule, or workflow_dispatch with an empty TASK: apply
              "On an audit".
            - EVENT workflow_dispatch with a TASK: do that TASK, following
              the audit procedure for branches and the PR.

            Today is the date given by `date -u +%F`.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git switch:*),Bash(git checkout:*),Bash(git fetch:*),Bash(git cherry-pick:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(cargo test:*),Bash(cargo doc:*),Bash(date:*)"
