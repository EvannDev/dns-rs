name: Claude docs

# The docs agent (.claude/agents/docs.md) keeps the documentation true to
# the code: on each PR it commits the documentation the change needs, and
# weekly (or on demand) it audits everything and opens a PR.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      task:
        description: What to document (leave empty for a full audit)
        required: false

concurrency:
  group: claude-docs-${{ github.event.pull_request.number || github.ref }}
  # Never kill the agent between its commit and its push.
  cancel-in-progress: false

jobs:
  docs:
    # On PRs: skip drafts, forks (no secrets), Dependabot, the agent's own
    # pushes (loop guard) and the agent's own follow-up branches.
    if: >-
      github.event_name != 'pull_request' || (
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        github.event.sender.login != 'claude[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'docs/agent-')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # On PRs, the branch itself (not the merge ref) so commits can be pushed.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      # The agent runs cargo test / cargo doc; the version comes from
      # rust-toolchain.toml, as in CI.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            EVENT: ${{ github.event_name }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR BASE: ${{ github.event.pull_request.base.ref }}
            TASK: ${{ inputs.task }}

            Read .claude/agents/docs.md: it defines your role, what you own,
            your accuracy rules and your procedures. Follow it exactly.

            - EVENT pull_request: apply "On a pull request" to PR NUMBER.
            - EVENT schedule, or workflow_dispatch with an empty TASK: apply
              "On an audit".
            - EVENT workflow_dispatch with a TASK: do that TASK, following
              the audit procedure for branches and the PR.

            Today is the date given by `date -u +%F`.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git switch:*),Bash(git checkout:*),Bash(git fetch:*),Bash(git cherry-pick:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(cargo test:*),Bash(cargo doc:*),Bash(date:*)"
