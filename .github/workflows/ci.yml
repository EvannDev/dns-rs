name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The Rust version is pinned in rust-toolchain.toml, shared with local builds.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  agent-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .claude/hooks/test-rust-refactor-guard.sh
      - run: .claude/hooks/test-devops-guard.sh
      - run: .github/scripts/test-claude-mode.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dns-rs:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - name: Smoke test the image
        run: |
          command -v dig || sudo apt-get install -y --no-install-recommends dnsutils
          mkdir -p "$RUNNER_TEMP/config"
          printf '[blocking]\ndeny = ["*.doubleclick.net"]\n' > "$RUNNER_TEMP/config/dns-rs.toml"
          docker run -d --name dns-rs \
            -p 127.0.0.1:15353:5353/udp -p 127.0.0.1:15353:5353/tcp -p 127.0.0.1:18080:8080 \
            -v "$RUNNER_TEMP/config:/etc/dns-rs:ro" -e DNS_RS_CONFIG=/etc/dns-rs/dns-rs.toml \
            dns-rs:ci
          for i in $(seq 1 60); do curl -sf localhost:18080/readyz && break; sleep 0.5; done
          curl -sf localhost:18080/readyz
          # Blocked over TCP, resolved over UDP, API disabled without a token.
          # Resolution goes to the real default upstream: unlike `cargo test`,
          # this end-to-end check deliberately uses the network.
          test "$(dig @127.0.0.1 -p 15353 +tcp ad.doubleclick.net +short)" = "0.0.0.0"
          test -n "$(dig @127.0.0.1 -p 15353 example.com +short +tries=3)"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:18080/api/v1/status)" = 403
          test "$(docker inspect dns-rs --format '{{.Config.User}}')" = 65532:65532
          # SIGTERM stops it cleanly.
          docker stop -t 10 dns-rs
          test "$(docker inspect dns-rs --format '{{.State.ExitCode}}')" = 0
      - name: Container logs
        if: always()
        run: docker logs dns-rs 2>&1 | tail -50

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/dns-rs
      - name: Unit tests
        # As the runner's user, so the tool can write next to the checkout.
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD/charts:/apps" helmunittest/helm-unittest:4.3.0-1.2.1 dns-rs
      - name: Validate rendered manifests
        # Defaults, then every optional feature (charts/dns-rs/ci/*.yaml);
        # CRDs such as ServiceMonitor are checked against the CRDs catalog.
        run: |
          # Without pipefail, a failed render piped into kubeconform would pass.
          set -o pipefail
          for values in "" charts/dns-rs/ci/*.yaml; do
            helm template ci charts/dns-rs ${values:+-f "$values"} \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0-alpine \
                  -strict -summary -kubernetes-version 1.34.0 \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
          done

