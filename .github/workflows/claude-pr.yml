name: Claude PR

# On each PR push: the docs agent first commits the documentation the change
# needs, then the review agent reviews the result, docs included. In that
# order a docs commit needs no review of its own, so the agent's pushes
# trigger nothing here.
#
# After a first full review, each push is reviewed and documented only from
# the last reviewed commit (scope job). The weekly docs audit lives in
# claude-docs.yml.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-pr-${{ github.event.pull_request.number }}
  # Never kill the docs agent between its commit and its push. A superseded
  # pending run is dropped, which loses nothing: the next run starts from
  # the last reviewed commit, not from the previous push.
  cancel-in-progress: false

permissions: {}

jobs:
  scope:
    # Skip drafts, forks (no secrets), Dependabot, and the docs agent's own
    # pushes, except on its follow-up branches, which still get a review.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' && (
        github.event.sender.login != 'claude[bot]' ||
        startsWith(github.event.pull_request.head.ref, 'docs/agent-')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      range: ${{ steps.mode.outputs.range }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      # The last commit the review agent covered, from the marker it ends
      # its summary with. Only the Claude app's comments count: nobody else
      # can post as claude[bot].
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          reviewed=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .body
                  | capture("<!-- claude-review: (?<sha>[0-9a-f]{40}) -->")? | .sha' | tail -1)
          .github/scripts/claude-mode.sh "$ACTION" "$reviewed" "origin/$BASE" | tee -a "$GITHUB_OUTPUT"

  docs:
    needs: scope
    if: >-
      needs.scope.outputs.mode != 'skip' &&
      !startsWith(github.event.pull_request.head.ref, 'docs/agent-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch itself (not the merge ref) so commits can be pushed.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Do not keep GITHUB_TOKEN in git config: checkout stores it as an
          # Authorization header that overrides the Claude app token, so the
          # agent's pushes would come from github-actions[bot], which GitHub
          # does not let trigger workflows (no CI on the agent's commits).
          persist-credentials: false

      # The agent runs cargo test / cargo doc; the version comes from
      # rust-toolchain.toml, as in CI.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The agent's report goes to the job summary, so a run that changes
          # nothing still says why. Inputs come only from people with write
          # access (forks are skipped above).
          display_report: true
          prompt: |
            REPO: ${{ github.repository }}
            EVENT: pull_request
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR BASE: ${{ github.event.pull_request.base.ref }}
            MODE: ${{ needs.scope.outputs.mode }}
            RANGE: ${{ needs.scope.outputs.range }}

            Read .claude/agents/docs.md: it defines your role, what you own,
            your accuracy rules and your procedures. Follow it exactly:
            apply "On a pull request" to PR NUMBER, in the given MODE.

            Today is the date given by `date -u +%F`.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git switch:*),Bash(git checkout:*),Bash(git fetch:*),Bash(git cherry-pick:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(cargo test:*),Bash(cargo doc:*),Bash(date:*)"

  review:
    needs: [scope, docs]
    # After docs, whatever its outcome: a failed docs run must not leave the
    # code unreviewed.
    if: >-
      always() && !cancelled() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch, not the event's SHA: it includes the docs commit.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          # Set one of the two secrets: a subscription token from
          # `claude setup-token`, or an Anthropic API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # PRs opened by the docs agent come from the Claude app. Only that
          # bot is allowed: '*' would let any app trigger a review with its
          # own prompt on this public repository.
          allowed_bots: claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.sha }}
            MODE: ${{ needs.scope.outputs.mode }}
            RANGE: ${{ needs.scope.outputs.range }}
            HEAD: ${{ steps.head.outputs.sha }}

            You review pull requests for dns-rs, a DNS sinkhole in Rust. Read
            CLAUDE.md first: its rules are the review checklist.

            Scope:
            - MODE full: review the diff against BASE, commit by commit when
              the history matters.
            - MODE incremental: an earlier review covered the PR up to the
              start of RANGE. Review only RANGE (`git log RANGE`,
              `git diff RANGE`; it includes any documentation commit),
              reading surrounding code only as needed. Then read your
              previous summaries (`gh pr view PR NUMBER --comments`) and
              state, for each [blocking] and [important] item, whether it is
              resolved, still open, or answered by the author.

            Check, in this order:

            1. Test-driven development
               - Every behaviour change comes with a test that covers it. Name
                 any behaviour (branch, error path, config option) left
                 untested, with the test you would expect.
               - Tests describe behaviour, are deterministic (injected time,
                 no sleep in unit tests, no network but loopback), and would
                 fail if the behaviour broke. Flag tests that cannot fail.
               - Tests capturing tracing output live alone in their own binary.
            2. Correctness
               - DNS protocol: response codes, IDs, TTLs, truncation, EDNS,
                 case-insensitive names. Cite the RFC when you flag a deviation.
               - The server must never panic on input: no unwrap/expect
                 outside tests; errors become DNS response codes or logs.
               - Concurrency: no lock held across .await, no blocking I/O in
                 async code, policy swaps stay atomic.
            3. Statelessness: a replica must keep no state that would break
               running several of them behind one service.
            4. Security: untrusted input from the network and from blocklists
               (sizes, parsing, resource exhaustion).
            5. Docs: README, dns-rs.example.toml and CLAUDE.md stay accurate.

            Do not comment on formatting or lints: CI enforces them.

            Post inline comments for specific issues, each starting with a
            severity: [blocking], [important] or [nit]. Then post one summary
            comment (`gh pr comment`) with a verdict: "Ready to merge" or
            "Changes requested", the blocking issues, and a short list of
            what is well done. Write comments in French; keep code
            identifiers as they are.

            End the summary with this line, verbatim; it records what you
            reviewed, so the next push is reviewed from there:
            <!-- claude-review: ${{ steps.head.outputs.sha }} -->
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
