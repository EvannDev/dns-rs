name: Claude

# Answers @claude mentions in issues and PR comments.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only people summon @claude: a bot comment quoting "@claude" (such as
    # a review mentioning the command) must not start a paid run.
    if: |
      github.event.sender.type != 'Bot' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Do not keep GITHUB_TOKEN in git config: checkout stores it as an
          # Authorization header that overrides the Claude app token, so the
          # agent's pushes would come from github-actions[bot], which GitHub
          # does not let trigger workflows (no CI on the agent's commits).
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(cargo fmt:*),Bash(cargo clippy:*),Bash(cargo test:*),Bash(cargo build:*)"
            --append-system-prompt "Follow CLAUDE.md. Work test-first: write the failing test, show it fail, then implement. Run cargo fmt, clippy and test before pushing. Reply in French."
