[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# DNS TTLs are expressed in seconds; converting them to minutes hurts readability.
duration_suboptimal_units = "allow"
# The library is internal to the binary, not published: error docs add little.
missing_errors_doc = "allow"

[profile.release]
# Debug symbols are not shipped: smaller binary and container image.
strip = "symbols"
