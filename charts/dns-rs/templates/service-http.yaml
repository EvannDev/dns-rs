apiVersion: v1
kind: Service
metadata:
  name: {{ include "dns-rs.fullname" . }}-http
  labels:
    {{- include "dns-rs.labels" . | nindent 4 }}
  {{- with .Values.service.http.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.http.type }}
  selector:
    {{- include "dns-rs.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.http.port }}
      targetPort: http
      protocol: TCP
