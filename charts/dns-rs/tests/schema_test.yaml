suite: values schema
templates:
  - templates/deployment.yaml
tests:
  - it: rejects zero replicas
    set:
      replicaCount: 0
    asserts:
      - failedTemplate:
          errorPattern: "replicaCount"

  - it: rejects an unknown service type
    set:
      service.dns.type: Loadbalancer
    asserts:
      - failedTemplate:
          errorPattern: "type"

  - it: rejects an unknown traffic policy
    set:
      service.dns.externalTrafficPolicy: local
    asserts:
      - failedTemplate:
          errorPattern: "externalTrafficPolicy"

  # The configuration is TOML text: a YAML map would lose integer types.
  - it: rejects a configuration given as a map
    set:
      config:
        cache:
          size: 20000
    asserts:
      - failedTemplate:
          errorPattern: "config"

  - it: rejects unknown top-level keys, catching typos
    set:
      replicas: 3
    asserts:
      - failedTemplate:
          errorPattern: "replicas"

  # The Kubernetes API rejects externalTrafficPolicy on a ClusterIP Service.
  - it: rejects a traffic policy on a ClusterIP service
    set:
      service.dns.type: ClusterIP
      service.dns.externalTrafficPolicy: Local
    asserts:
      - failedTemplate:
          errorPattern: "externalTrafficPolicy"

  - it: accepts a traffic policy on a LoadBalancer service
    set:
      service.dns.type: LoadBalancer
      service.dns.externalTrafficPolicy: Local
    asserts:
      - notFailedTemplate: {}

  - it: rejects a negative cache size
    set:
      cache.size: -1
    asserts:
      - failedTemplate:
          errorPattern: "size"

  # dns-rs refuses shorter tokens at startup: pods would crash-loop.
  - it: rejects an API token shorter than 16 characters
    set:
      api.token: short
    asserts:
      - failedTemplate:
          errorPattern: "token"

  - it: accepts the default values
    asserts:
      - notFailedTemplate: {}
