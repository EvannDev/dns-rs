suite: deployment
templates:
  - templates/deployment.yaml
tests:
  - it: runs two replicas of the chart's image version by default
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/evanndev/dns-rs:0.1.0

  - it: uses the image tag given in values
    set:
      image.tag: edge
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/evanndev/dns-rs:edge

  - it: exposes DNS on 5353 (UDP and TCP) and HTTP on 8080
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content: {name: dns-udp, containerPort: 5353, protocol: UDP}
      - contains:
          path: spec.template.spec.containers[0].ports
          content: {name: dns-tcp, containerPort: 5353, protocol: TCP}
      - contains:
          path: spec.template.spec.containers[0].ports
          content: {name: http, containerPort: 8080, protocol: TCP}

  - it: reads its configuration from the mounted ConfigMap
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DNS_RS_CONFIG, value: /etc/dns-rs/dns-rs.toml}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: config, mountPath: /etc/dns-rs, readOnly: true}
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: RELEASE-NAME-dns-rs

  # A checksum annotation would restart pods on every config change, while
  # dns-rs reloads [blocking] changes by itself (ADR 0010).
  - it: does not restart pods when the configuration changes
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: probes liveness and readiness over HTTP
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value: {path: /healthz, port: http}
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value: {path: /readyz, port: http}

  # Kubernetes can only verify runAsNonRoot against a numeric user; the
  # image's "nonroot" name made pods fail with CreateContainerConfigError.
  - it: runs as the numeric nonroot user
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 65532

  - it: runs hardened, without privileges
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

  - it: passes scheduling settings through
    set:
      nodeSelector: {kubernetes.io/arch: arm64}
      tolerations: [{key: dedicated, operator: Exists}]
      podLabels: {team: network}
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {kubernetes.io/arch: arm64}
      - equal:
          path: spec.template.spec.tolerations
          value: [{key: dedicated, operator: Exists}]
      - equal:
          path: spec.template.metadata.labels.team
          value: network

  # The container ports above only work if dns-rs listens on them: the chart
  # says so itself instead of relying on the image's defaults.
  - it: sets the listen addresses matching the container ports
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DNS_RS_LISTEN, value: "0.0.0.0:5353"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DNS_RS_HTTP_LISTEN, value: "0.0.0.0:8080"}

  # Settings that only apply at startup go into the pod template: changing
  # them rolls every replica, so replicas never run different values.
  - it: passes upstream and cache settings as environment variables
    set:
      upstream.server: "9.9.9.9:53"
      upstream.timeoutMs: 1500
      cache.size: 50000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DNS_RS_UPSTREAM, value: "9.9.9.9:53"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DNS_RS_UPSTREAM_TIMEOUT_MS, value: "1500"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DNS_RS_CACHE_SIZE, value: "50000"}

  # Helm reads numbers as float64: without a conversion, quote prints large
  # ones in scientific notation ("1e+06"), which dns-rs rejects at startup.
  - it: writes large numbers in full
    set:
      upstream.timeoutMs: 2000000
      cache.size: 1000000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DNS_RS_CACHE_SIZE, value: "1000000"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DNS_RS_UPSTREAM_TIMEOUT_MS, value: "2000000"}

  - it: refuses restart-only keys written as inline tables
    set:
      config: |
        cache = { size = 5 }
    asserts:
      - failedTemplate:
          errorPattern: "cache.size"

  - it: refuses restart-only sections in the reloaded configuration
    set:
      config: |
        [blocking]
        deny = ["ads.example.com"]
        [cache]
        size = 5
    asserts:
      - failedTemplate:
          errorPattern: "cache.size"

  - it: refuses restart-only dotted keys in the reloaded configuration
    set:
      config: |
        upstream.server = "9.9.9.9"
    asserts:
      - failedTemplate:
          errorPattern: "upstream"

  - it: accepts a blocking-only configuration with comments
    set:
      config: |
        # [cache] lives in values, not here
        [blocking]
        deny = ["cache.example.com"]
    asserts:
      - notFailedTemplate: {}

  # ADR 0016: local records apply live too.
  - it: accepts local records in the reloaded configuration
    set:
      config: |
        [blocking]
        deny = ["ads.example.com"]
        [local]
        records = [{ name = "nas.home.arpa", ip = "192.168.1.10" }]
    asserts:
      - notFailedTemplate: {}

  - it: names the sections it accepts when refusing one
    set:
      config: |
        [server]
        listen = "0.0.0.0:53"
    asserts:
      - failedTemplate:
          errorPattern: "only hold \\[blocking\\] and \\[local\\]"

  - it: uses the pull policy and resources from values
    set:
      image.pullPolicy: Always
      resources: {requests: {cpu: 10m}}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      # --set merges with the defaults: only the given value changes.
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 10m

