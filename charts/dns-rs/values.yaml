# Replicas share nothing: each loads the configuration and lists itself.
replicaCount: 2

image:
  repository: ghcr.io/evanndev/dns-rs
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Startup settings. They are passed as environment variables, so changing
# them rolls every replica: replicas never run different values.
upstream:
  # Resolver queries are forwarded to; the port defaults to 53.
  server: "1.1.1.1:53"
  timeoutMs: 2000
cache:
  # Maximum number of cached responses.
  size: 10000

# The [blocking] part of dns-rs.toml, as TOML text (see
# dns-rs.example.toml). It becomes a ConfigMap that dns-rs reads again every
# 10 s, so changes apply without restarting pods. Startup settings
# ([server], [http], [upstream], [cache]) are refused here: set them above,
# where a change rolls every replica.
config: |
  [blocking]
  mode = "null"
  # lists = ["https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"]

# The API (/api/v1/...) needs a bearer token; without one it is disabled.
api:
  # The token is mounted as a file that dns-rs reads again: rotating it
  # reaches every replica within about a minute, without a restart.
  # Token created as a Secret by the chart. Prefer existingSecret: a token in
  # values ends up in Helm's release history.
  token: ""
  # Or a Secret you manage (sealed, external-secrets…).
  existingSecret: ""
  existingSecretKey: token

service:
  dns:
    type: ClusterIP
    port: 53
    # With type LoadBalancer, "Local" keeps client IP addresses, which
    # per-client rules and the query log need.
    externalTrafficPolicy: ""
    annotations: {}
  http:
    type: ClusterIP
    port: 8080
    annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Keeps all but one replica up during node drains and upgrades. Only
# rendered with more than one replica.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Spreads replicas across nodes when possible (ScheduleAnyway).
topologySpread:
  enabled: true

# Prometheus Operator ServiceMonitor for /metrics.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# `helm test`: a pod queries the DNS Service over UDP and TCP. It passes
# when dns-rs answers, whatever the answer. With networkPolicy.dns.from
# set, allow pods labelled app.kubernetes.io/component=test.
tests:
  enabled: true
  image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.7
  query: example.com

# Ingress filtering. Egress stays open: dns-rs queries its upstream and
# downloads blocklists. Kubelet probes come from the node and are usually
# allowed by the CNI regardless.
networkPolicy:
  enabled: false
  dns:
    # NetworkPolicyPeers allowed to query DNS; empty means everyone.
    from: []
  http:
    # NetworkPolicyPeers allowed on 8080 (metrics, API); empty means nobody.
    from: []
